##### STATUS ############################################################

set -g status-position top
set -g status on

set -g status-style "bg=default,fg=#D4BE98"

##### MESSAGES ##########################################################

set -g message-style "bg=#32302F,fg=#D4BE98"
set -g message-command-style "bg=#32302F,fg=#7DAEA3"

##### POPUPS ############################################################

set -g popup-style "bg=default"
set -g popup-border-style " bg=default"

##### CLOCK #############################################################

set -g clock-mode-colour "#7DAEA3"

##### WINDOWS ###########################################################

# Start window numbering at 1
set -g base-index 1

set -g mode-style "fg=#32302F,bg=#7DAEA3,bold"

setw -g window-status-style "fg=#7C6F64,bg=default"
setw -g window-status-current-style "fg=#7DAEA3,bold,bg=default"

setw -g window-status-format "  #I:#W  "
setw -g window-status-current-format "  [#I]:#W  "

setw -g window-status-separator ""

set -g automatic-rename on
set -g automatic-rename-format "#{b:pane_current_command}"
set -g renumber-windows on
